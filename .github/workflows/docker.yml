name: docker

# Two variants are built from every push:
#   default (CUDA 12.8, GTX 16xx/RTX 20xx and newer, up to RTX 50xx)
#   pascal  (CUDA 12.6, also GTX 10xx; not for RTX 50xx)
# Each is built from a base image (Dockerfile.base: PyTorch and dependencies) that is only rebuilt when its inputs change,
# so most pushes build just the small app layers and users only download those.
# main         -> :latest          and :pascal
# other branch -> :<branch>        and :<branch>-pascal
# tag v1.2.3   -> :1.2.3           and :1.2.3-pascal
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'unraid/**'
      - 'research/**'
  # Weekly rebuild. The base image tag below includes the digest of the python base image, so when Docker publishes a
  # patched python:3.11-slim-bookworm the base is rebuilt with those fixes; otherwise nothing changes.
  schedule:
    - cron: '52 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            cuda: cu128
            suffix: ''
          - variant: pascal
            cuda: cu126
            suffix: '-pascal'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # GPU PyTorch makes the image several GB, so clear space on the runner first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base image (PyTorch plus every dependency) only changes when its inputs do. It is published under a tag that
      # includes a hash of those inputs, so it is built once and reused by every later push (and by users: same layers).
      - id: base
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Include the current digest of the FROM image, so a patched python base image triggers a base rebuild
          from=$(awk '/^FROM /{print $2; exit}' Dockerfile.base)
          from_digest=$(docker buildx imagetools inspect "$from" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "FROM $from is $from_digest"
          hash=$(echo "${{ hashFiles('Dockerfile.base', 'docker/requirements.txt', 'docker/smoke.py') }} $from_digest" | sha256sum | cut -c1-16)
          ref="$repo:base-${{ matrix.cuda }}-$hash"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Base image $ref already published, reusing it"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Base image $ref not found, building it"
          fi

      - name: Build and publish the base image
        if: steps.base.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          build-args: |
            TORCH_CUDA=${{ matrix.cuda }}
          tags: ${{ steps.base.outputs.ref }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch && matrix.variant == 'default' }}
            type=raw,value=pascal,enable=${{ github.ref_name == github.event.repository.default_branch && matrix.variant == 'pascal' }}
            type=ref,event=branch,suffix=${{ matrix.suffix }},enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=sha,format=short,suffix=${{ matrix.suffix }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

